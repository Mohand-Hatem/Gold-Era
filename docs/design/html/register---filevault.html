<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopNavBar (Suppressed for Transactional Intent - Register Screen) -->
<!-- Main Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter relative overflow-hidden">
<!-- Decorative Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-surface-variant via-background to-background"></div>
<div class="relative z-10 w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_10px_15px_-3px_rgba(0,0,0,0.05)] border border-outline-variant/30 p-xl">
<!-- Header -->
<div class="text-center mb-xl">
<div class="flex items-center justify-center gap-2 mb-sm">
<span class="material-symbols-outlined text-secondary text-3xl" style="font-variation-settings: 'FILL' 1;">folder_shared</span>
<h1 class="font-h2 text-h2 text-on-surface">FileVault</h1>
</div>
<h2 class="font-h1 text-h1-mobile md:text-h1 text-on-surface mb-xs">Create an Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Store, organize, and share your files securely.</p>
</div>
<!-- Registration Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Full Name -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md leading-5 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-colors font-body-md text-body-md" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md leading-5 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-colors font-body-md text-body-md" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md leading-5 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs" for="confirmPassword">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">lock_reset</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-md leading-5 bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-colors font-body-md text-body-md" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start mt-sm">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-secondary focus:ring-secondary/20 border-outline-variant rounded bg-surface-container-lowest" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-2 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            I agree to the <a class="font-medium text-secondary hover:underline" href="#">Terms and Conditions</a> and <a class="font-medium text-secondary hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm font-body-md text-body-md font-medium text-on-primary bg-primary hover:bg-on-surface focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors" type="submit">
                        Create Account
                    </button>
</div>
</form>
<!-- Login Link -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="font-medium text-secondary hover:underline transition-colors" href="#">Log in</a>
</p>
</div>
<!-- Divider -->
<div class="mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/50"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-body-sm text-body-sm">
                            Or continue with
                        </span>
</div>
</div>
<!-- Social Logins (Placeholder for visual completeness based on typical patterns, though not explicitly requested, adds polish) -->
<div class="mt-md grid grid-cols-2 gap-3">
<button class="w-full inline-flex justify-center py-2 px-4 border border-outline-variant rounded-md shadow-sm bg-surface-container-lowest text-sm font-medium text-on-surface hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors" type="button">
<span class="sr-only">Sign in with Google</span>
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12.0003 4.75C13.7703 4.75 15.3553 5.36002 16.6053 6.54998L20.0303 3.125C17.9502 1.19 15.2353 0 12.0003 0C7.31028 0 3.25527 2.69 1.28027 6.60998L5.27028 9.70498C6.21525 6.86002 8.87028 4.75 12.0003 4.75Z" fill="#EA4335"></path>
<path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"></path>
<path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"></path>
<path d="M12.0004 24C15.2404 24 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26537 14.29L1.27539 17.385C3.25539 21.31 7.3104 24 12.0004 24Z" fill="#34A853"></path>
</svg>
</button>
<button class="w-full inline-flex justify-center py-2 px-4 border border-outline-variant rounded-md shadow-sm bg-surface-container-lowest text-sm font-medium text-on-surface hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors" type="button">
<span class="sr-only">Sign in with Microsoft</span>
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M11.4 24H0V12.6H11.4V24ZM24 24H12.6V12.6H24V24ZM11.4 11.4H0V0H11.4V11.4ZM24 11.4H12.6V0H24V11.4Z" fill="#00a4ef"></path>
</svg>
</button>
</div>
</div>
</div>
</main>

</body></html>
