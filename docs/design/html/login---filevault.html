<body class="bg-background text-on-surface font-body-md antialiased selection:bg-secondary selection:text-on-secondary min-h-screen flex flex-col">
<!-- Transactional Page Layout: Nav and Footer suppressed per design guidelines -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter w-full max-w-container-max mx-auto">
<!-- Login Card (Level 2 Elevation) -->
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.05)] p-xl relative overflow-hidden">
<!-- Subtle Decorative Element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary/5 rounded-bl-full pointer-events-none"></div>
<!-- Brand Header -->
<div class="flex flex-col items-center mb-xl">
<div class="flex items-center gap-xs mb-sm">
<span class="material-symbols-filled text-secondary text-[28px]" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-h2 text-h2 text-on-surface tracking-tight">FileVault</span>
</div>
<h1 class="font-h3 text-h3 text-on-surface mt-sm">Sign In</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Access your secure workspace</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline-variant pointer-events-none select-none text-[20px]">mail</span>
<input class="w-full h-10 pl-[36px] pr-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-DEFAULT focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all placeholder:text-outline-variant/60" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-baseline">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-outline-variant pointer-events-none select-none text-[20px]">lock</span>
<input class="w-full h-10 pl-[36px] pr-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-DEFAULT focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all placeholder:text-outline-variant/60" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="mt-sm">
<button class="w-full h-11 bg-primary text-on-primary font-body-md text-body-md rounded-lg flex items-center justify-center gap-xs hover:opacity-90 active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-primary/20" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-secondary font-medium hover:text-secondary-container transition-colors ml-xs" href="#">Create an account</a>
</p>
